name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Validate and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workout Planner Code
        uses: actions/checkout@v4
        with:
          path: fitlab-mfe-workout-planner

      - name: Checkout Tooling Code
        uses: actions/checkout@v4
        with:
          repository: alexandresouva/fitlab-lib-tooling
          path: fitlab-lib-tooling

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: fitlab-mfe-workout-planner/package-lock.json

      - name: Install and Build Tooling
        run: |
          cd fitlab-lib-tooling
          npm ci
          npm run build

      - name: Install Workout Planner Dependencies
        run: |
          cd fitlab-mfe-workout-planner
          npm ci

      - name: Lint Code
        run: |
          cd fitlab-mfe-workout-planner
          npm run lint

      - name: Run Tests
        run: |
          cd fitlab-mfe-workout-planner
          npm run test:ci

      - name: Build Application
        run: |
          cd fitlab-mfe-workout-planner
          npm run build

  deploy:
    name: Deploy to AWS S3 / CloudFront
    runs-on: ubuntu-latest
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout Workout Planner Code
        uses: actions/checkout@v4
        with:
          path: fitlab-mfe-workout-planner

      - name: Checkout Tooling Code
        uses: actions/checkout@v4
        with:
          repository: alexandresouva/fitlab-lib-tooling
          path: fitlab-lib-tooling

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: fitlab-mfe-workout-planner/package-lock.json

      - name: Install and Build Tooling
        run: |
          cd fitlab-lib-tooling
          npm ci
          npm run build

      - name: Install Workout Planner Dependencies
        run: |
          cd fitlab-mfe-workout-planner
          npm ci

      - name: Build Application
        run: |
          cd fitlab-mfe-workout-planner
          npm run build

      - name: Sync to S3
        run: aws s3 sync fitlab-mfe-workout-planner/dist/fitlab-mfe-workout-planner/browser/ s3://fitlab-mfe-workouts-dev/workouts/ --delete

      - name: Invalidate CloudFront Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DIST_ID }} --paths "/workouts/*"
